# https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/#the-whole-ci-cd-workflow
name: Publish Python distribution to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  # Do not build or publish a release unless the reusable checks workflow succeeds.
  checks:
    name: Run checks
    uses: ./.github/workflows/checks.yml

  # step 1
  build:
    name: Build distribution
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install hatch
      run: >-
        python3 -m
        pip install
        hatch
        --user

    - name: Build a binary wheel and a source tarball
      run: python3 -m hatch build

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  # step 2
  publish-to-pypi:
    name: Publish Python distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kitsunekko-tools
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8.0.1
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
