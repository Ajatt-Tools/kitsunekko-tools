[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling>=1.18",
  "hatch-vcs>=0.4",
]

[project]
name = "kitsunekko-tools"
description = "A set of scripts for creating a local kitsunekko mirror."
readme = "README.md"
dynamic = ["version"]
authors = [
  { name = "Ren Tatsumoto", email = "tatsu@autistici.org" },
]
dependencies = [
  "httpx[socks]>=0.28",
  "fire>=0.6.0",
  "beartype>=0.10.0",
  "Jinja2>=3.1.0",
]
license = {file = "LICENSE"}
requires-python = ">=3.13"

[project.scripts]
ktools = "kitsunekko_tools.__main__:main"

[tool.hatch.build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
path = "kitsunekko_tools/__version__.py"

[tool.hatch.build.hooks.vcs]
version-file = "kitsunekko_tools/__version__.py"

[tool.black]
line-length = 120
target-version = ['py313']

[tool.isort]
profile = "black"

[tool.hatch.envs.dev]
dependencies = [
  "pip",
  "mypy>=1.0.0",
  "isort",
  "pytest",
  "black",
  "pyupgrade",
]
[tool.hatch.envs.dev.scripts]
# run as `hatch run dev:scriptname`
check = "mypy --install-types --non-interactive {args:kitsunekko_tools tests}"
format = "bash \"$(git rev-parse --show-toplevel)/format.sh\""
test = "pytest;"

[tool.hatch.envs.hatch-test]
# https://hatch.pypa.io/latest/config/internal/testing/
# https://hatch.pypa.io/latest/tutorials/testing/overview/
dependencies = [
    "mypy>=1.0.0",
    "pytest",
    "pytest-asyncio",
]
randomize = true

[[tool.hatch.envs.hatch-test.matrix]]
# https://hatch.pypa.io/latest/tutorials/testing/overview/#testing-projects
python = ["3.13", ]

[tool.hatch.envs.hatch-static-analysis]
# https://hatch.pypa.io/latest/how-to/static-analysis/behavior/
dependencies = [
    "black",
    "flake8",
    "isort",
    "pyupgrade",
]

[tool.hatch.envs.hatch-static-analysis.scripts]
format-check = [
    "black --check --diff {args:.}",
    "isort --check-only --diff {args:.}",
]
format-fix = [
    # run as: hatch fmt -f
    "bash \"$(git rev-parse --show-toplevel)/scripts/format.sh\" ",
]
lint-check = "flake8 --max-line-length 120 {args:.}"
lint-fix = "lint-check"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore:There is no current event loop",
]
